[package]
name = "budget"
version = "1.0.0"
description = "Личный бюджет"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
tauri-plugin-notification = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
